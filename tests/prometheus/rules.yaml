rule_files:
  - ../../rendered/prometheus-rules.yaml
  - ../../rendered/vector-rules.yaml
  - ../../rendered/kubernetes-recording-rules.yaml
  - ../../rendered/kubernetes-alert-rules.yaml
evaluation_interval: 1m
tests:
  - name: down scrape pages after five minutes and clears on recovery
    interval: 1m
    input_series:
      - series: up{job="coredns",instance="fixture"}
        values: 0+0x5 1+0x2
      - series: up{job="unmonitored",instance="fixture"}
        values: 0+0x8
    alert_rule_test:
      - eval_time: 4m
        alertname: StaticTargetScrapeFailed
      - eval_time: 5m
        alertname: StaticTargetScrapeFailed
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: coredns
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: Prometheus cannot scrape coredns at fixture.
              description: Check the target process, listener, scrape path, and network reachability.
      - eval_time: 7m
        alertname: StaticTargetScrapeFailed
  - name: Apache status failure is distinct from exporter scrape success
    interval: 1m
    input_series:
      - series: up{job="apache-exporter",instance="fixture"}
        values: 1+0x6
      - series: apache_up{job="apache-exporter",instance="fixture"}
        values: 0+0x6
    alert_rule_test:
      - eval_time: 6m
        alertname: StaticTargetScrapeFailed
      - eval_time: 6m
        alertname: ApacheStatusScrapeFailed
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: apache-exporter
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: The Apache exporter cannot read Apache status at fixture.
              description: Check the configured scrape URI, mod_status access rules, and the Apache service.
  - name: HAProxy alert preserves the affected backend and ignores zero-valued down series
    interval: 1m
    input_series:
      - series: haproxy_backend_status{job="haproxy",instance="fixture",proxy="unavailable",state="DOWN"}
        values: 1+0x6
      - series: haproxy_backend_status{job="haproxy",instance="fixture",proxy="available",state="DOWN"}
        values: 0+0x6
    alert_rule_test:
      - eval_time: 6m
        alertname: HAProxyBackendDown
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: haproxy
              proxy: unavailable
              state: DOWN
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: HAProxy backend unavailable is down at fixture.
              description: Check server health and connectivity in the affected backend.
  - name: Node Exporter reports textfile errors after five minutes while its endpoint is reachable
    interval: 1m
    input_series:
      - series: up{job="node-exporter",instance="fixture"}
        values: 1+0x8
      - series: node_textfile_scrape_error{job="node-exporter",instance="fixture"}
        values: 1+0x5 0+0x2
      - series: up{job="node-exporter",instance="unreachable"}
        values: 0+0x8
      - series: node_textfile_scrape_error{job="node-exporter",instance="unreachable"}
        values: 1+0x8
      - series: up{job="other",instance="different-job"}
        values: 1+0x8
      - series: node_textfile_scrape_error{job="other",instance="different-job"}
        values: 1+0x8
    alert_rule_test:
      - eval_time: 4m
        alertname: NodeTextFileCollectorScrapeError
      - eval_time: 5m
        alertname: NodeTextFileCollectorScrapeError
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: node-exporter
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: Node Exporter could not read textfile metrics at fixture.
              description: Check the configured textfile directories, permissions, and Prometheus format of the metric files.
      - eval_time: 5m
        alertname: StaticTargetScrapeFailed
        exp_alerts:
          - exp_labels:
              instance: unreachable
              job: node-exporter
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: Prometheus cannot scrape node-exporter at unreachable.
              description: Check the target process, listener, scrape path, and network reachability.
      - eval_time: 7m
        alertname: NodeTextFileCollectorScrapeError
  - name: Vector alerts after ten minutes of positive error rates and clears when they stop
    interval: 1m
    input_series:
      - series: vector_component_errors_total{job="vector",component_id="fixture"}
        values: 0+1x11 11+0x5
      - series: vector_component_errors_total{job="other",component_id="fixture"}
        values: 0+1x17
    alert_rule_test:
      - eval_time: 10m
        alertname: VectorComponentErrors
      - eval_time: 11m
        alertname: VectorComponentErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: Vector records sustained component errors.
              description: Inspect the error type, component logs, and pipeline inputs before enabling notifications.
      - eval_time: 15m
        alertname: VectorComponentErrors
  - name: Kubernetes reports a crash looping container after fifteen minutes and clears on recovery
    interval: 1m
    input_series:
      - series: kube_pod_container_status_waiting_reason{job="kube-state-metrics",reason="CrashLoopBackOff",namespace="demo",pod="web",container="server"}
        values: 1+0x15 0+0x5
    alert_rule_test:
      - eval_time: 14m
        alertname: KubePodCrashLooping
      - eval_time: 15m
        alertname: KubePodCrashLooping
        exp_alerts:
          - exp_labels:
              container: server
              job: kube-state-metrics
              namespace: demo
              owner: prometheus
              pod: web
              reason: CrashLoopBackOff
              severity: warning
            exp_annotations:
              description: 'Pod demo/web (server) is in waiting state (reason: "CrashLoopBackOff").'
              runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepodcrashlooping
              summary: Pod is crash looping.
      - eval_time: 20m
        alertname: KubePodCrashLooping
  - name: API server hourly request counts retain each upstream status class and verb
    interval: 1m
    input_series:
      - series: apiserver_request_total{job="kube-apiserver",cluster="demo",code="200",verb="GET"}
        values: 0+1x60
      - series: apiserver_request_total{job="kube-apiserver",cluster="demo",code="302",verb="GET"}
        values: 0+2x60
      - series: apiserver_request_total{job="kube-apiserver",cluster="demo",code="404",verb="POST"}
        values: 0+3x60
      - series: apiserver_request_total{job="kube-apiserver",cluster="demo",code="503",verb="POST"}
        values: 0+4x60
      - series: apiserver_request_total{job="kube-apiserver",cluster="demo",code="101",verb="GET"}
        values: 0+5x60
      - series: apiserver_request_total{job="other",cluster="demo",code="200",verb="GET"}
        values: 0+6x60
    promql_expr_test:
      - expr: code_verb:apiserver_request_total:increase1h
        eval_time: 1h
        exp_samples:
          - labels: code_verb:apiserver_request_total:increase1h{cluster="demo",code="200",verb="GET"}
            value: 60
          - labels: code_verb:apiserver_request_total:increase1h{cluster="demo",code="302",verb="GET"}
            value: 120
          - labels: code_verb:apiserver_request_total:increase1h{cluster="demo",code="404",verb="POST"}
            value: 180
          - labels: code_verb:apiserver_request_total:increase1h{cluster="demo",code="503",verb="POST"}
            value: 240
