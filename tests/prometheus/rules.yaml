rule_files:
  - ../../rendered/prometheus-rules.yaml
evaluation_interval: 1m
tests:
  - name: down scrape pages after five minutes and clears on recovery
    interval: 1m
    input_series:
      - series: up{job="coredns",instance="fixture"}
        values: 0+0x5 1+0x2
      - series: up{job="unmonitored",instance="fixture"}
        values: 0+0x8
    alert_rule_test:
      - eval_time: 4m
        alertname: StaticTargetScrapeFailed
      - eval_time: 5m
        alertname: StaticTargetScrapeFailed
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: coredns
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: Prometheus cannot scrape coredns at fixture.
              description: Check the target process, listener, scrape path, and network reachability.
      - eval_time: 7m
        alertname: StaticTargetScrapeFailed
  - name: Apache status failure is distinct from exporter scrape success
    interval: 1m
    input_series:
      - series: up{job="apache-exporter",instance="fixture"}
        values: 1+0x6
      - series: apache_up{job="apache-exporter",instance="fixture"}
        values: 0+0x6
    alert_rule_test:
      - eval_time: 6m
        alertname: StaticTargetScrapeFailed
      - eval_time: 6m
        alertname: ApacheStatusScrapeFailed
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: apache-exporter
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: The Apache exporter cannot read Apache status at fixture.
              description: Check the configured scrape URI, mod_status access rules, and the Apache service.
  - name: HAProxy alert preserves the affected backend and ignores zero-valued down series
    interval: 1m
    input_series:
      - series: haproxy_backend_status{job="haproxy",instance="fixture",proxy="unavailable",state="DOWN"}
        values: 1+0x6
      - series: haproxy_backend_status{job="haproxy",instance="fixture",proxy="available",state="DOWN"}
        values: 0+0x6
    alert_rule_test:
      - eval_time: 6m
        alertname: HAProxyBackendDown
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: haproxy
              proxy: unavailable
              state: DOWN
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: HAProxy backend unavailable is down at fixture.
              description: Check server health and connectivity in the affected backend.
  - name: Node Exporter reports textfile errors after five minutes while its endpoint is reachable
    interval: 1m
    input_series:
      - series: up{job="node-exporter",instance="fixture"}
        values: 1+0x8
      - series: node_textfile_scrape_error{job="node-exporter",instance="fixture"}
        values: 1+0x5 0+0x2
      - series: up{job="node-exporter",instance="unreachable"}
        values: 0+0x8
      - series: node_textfile_scrape_error{job="node-exporter",instance="unreachable"}
        values: 1+0x8
      - series: up{job="other",instance="different-job"}
        values: 1+0x8
      - series: node_textfile_scrape_error{job="other",instance="different-job"}
        values: 1+0x8
    alert_rule_test:
      - eval_time: 4m
        alertname: NodeTextFileCollectorScrapeError
      - eval_time: 5m
        alertname: NodeTextFileCollectorScrapeError
        exp_alerts:
          - exp_labels:
              instance: fixture
              job: node-exporter
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: Node Exporter could not read textfile metrics at fixture.
              description: Check the configured textfile directories, permissions, and Prometheus format of the metric files.
      - eval_time: 5m
        alertname: StaticTargetScrapeFailed
        exp_alerts:
          - exp_labels:
              instance: unreachable
              job: node-exporter
              severity: warning
              owner: prometheus
            exp_annotations:
              summary: Prometheus cannot scrape node-exporter at unreachable.
              description: Check the target process, listener, scrape path, and network reachability.
      - eval_time: 7m
        alertname: NodeTextFileCollectorScrapeError
