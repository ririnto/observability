name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/observability-jsonnet-vendor
          key: jsonnet-${{ runner.os }}-${{ hashFiles('scripts/generate.sh', 'go.mod', 'go.sum') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          JSONNET_VENDOR_CACHE: ${{ runner.temp }}/observability-jsonnet-vendor
