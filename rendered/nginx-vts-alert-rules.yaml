groups:
  - interval: 1m
    name: nginx-vts
    rules:
      - alert: NginxVTSSuccessRateLow
        annotations:
          description: The NGINX VTS request success rate for {{ $labels.job }} is {{ printf "%.4g" $value }}%. Check 4xx and 5xx responses.
          summary: NGINX VTS request success rate is low.
        expr: 100 * ((sum by (job, cluster) (rate(nginx_vts_server_requests_total{job=~".+", host!="*", code=~"[1-3]xx"}[5m])) or (0 * sum by (job, cluster) (rate(nginx_vts_server_requests_total{job=~".+", host!="*", code=~"[1-5]xx"}[5m])))) / (sum by (job, cluster) (rate(nginx_vts_server_requests_total{job=~".+", host!="*", code=~"[1-5]xx"}[5m])) > 0)) < 85
        for: 5m
        labels:
          owner: prometheus
          severity: critical
      - alert: NginxVTSSuccessRateLow
        annotations:
          description: The NGINX VTS request success rate for {{ $labels.job }} is {{ printf "%.4g" $value }}%. Check 4xx and 5xx responses.
          summary: NGINX VTS request success rate is low.
        expr: 100 * ((sum by (job, cluster) (rate(nginx_vts_server_requests_total{job=~".+", host!="*", code=~"[1-3]xx"}[5m])) or (0 * sum by (job, cluster) (rate(nginx_vts_server_requests_total{job=~".+", host!="*", code=~"[1-5]xx"}[5m])))) / (sum by (job, cluster) (rate(nginx_vts_server_requests_total{job=~".+", host!="*", code=~"[1-5]xx"}[5m])) > 0)) < 95
        for: 5m
        labels:
          owner: prometheus
          severity: warning
