      - annotations:
          description: |
            Memory is filling up at {{ $labels.instance }}, has been above 90% for the last 15 minutes, is currently at {{ printf "%.2f" $values.A.Value }}%.
          summary: Host is running out of memory.
        condition: B
        data:
          - datasourceUid: prometheus
            model:
              expr: |
                100 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} * 100) > 90
              instant: true
              range: false
              refId: A
            refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - datasourceUid: __expr__
            model:
              expression: is_null($A) == 0
              refId: B
              type: math
            refId: B
            relativeTimeRange:
              from: 0
              to: 0
        execErrState: Error
        for: 15m
        isPaused: true
        labels:
          owner: grafana
          prometheus_alertname: NodeMemoryHighUtilization
          severity: warning
        noDataState: OK
        title: NodeMemoryHighUtilization
        uid: obs-d80e582cd33ef61e58d6a5884826e413
