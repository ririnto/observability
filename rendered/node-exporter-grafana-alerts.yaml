apiVersion: 1
groups:
  - folder: Node Exporter
    interval: 1m
    name: node-exporter
    orgId: 1
    rules:
      - annotations:
          description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf "%.2f" $values.A.Value }}% available space left and is filling up.
          summary: Filesystem is predicted to run out of space within the next 24 hours.
        condition: B
        data:
          - datasourceUid: prometheus
            model:
              expr: |
                (
                  node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""} / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""} * 100 < 40
                and
                  predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}[6h], 24*60*60) < 0
                and
                  node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""} == 0
                )
              instant: true
              range: false
              refId: A
            refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - datasourceUid: __expr__
            model:
              expression: is_null($A) == 0
              refId: B
              type: math
            refId: B
            relativeTimeRange:
              from: 0
              to: 0
        execErrState: Error
        for: 1h
        isPaused: true
        labels:
          owner: grafana
          prometheus_alertname: NodeFilesystemSpaceFillingUp
          severity: warning
        noDataState: OK
        title: NodeFilesystemSpaceFillingUp (severity=warning)
        uid: obs-85355ddf0b7130b43acf368c837e7655
