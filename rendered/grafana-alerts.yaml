"apiVersion": 1
"groups":
  - "folder": "Static targets"
    "interval": "1m"
    "name": "Vector pipeline"
    "orgId": 1
    "rules":
      - "annotations":
          "description": "Inspect the error type, component logs, and pipeline inputs before enabling notifications."
          "summary": "Vector records sustained component errors."
        "condition": "B"
        "data":
          - "datasourceUid": "prometheus"
            "model":
              "expr": 'sum(rate(vector_component_errors_total{job="vector"}[5m]))'
              "instant": true
              "range": false
              "refId": "A"
            "refId": "A"
            "relativeTimeRange":
              "from": 300
              "to": 0
          - "datasourceUid": "__expr__"
            "model":
              "expression": "$A > 0"
              "refId": "B"
              "type": "math"
            "refId": "B"
            "relativeTimeRange":
              "from": 0
              "to": 0
        "execErrState": "Error"
        "for": "10m"
        "isPaused": true
        "labels":
          "owner": "grafana"
          "severity": "warning"
        "noDataState": "OK"
        "title": "Vector component errors"
        "uid": "static-vector-component-errors"
