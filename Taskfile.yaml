version: 3

tasks:
  generate:
    env:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "rendered"}}'
    cmds:
      - bash scripts/generate.sh
  check:generated:
    cmds:
      - bash tests/check-generated.sh
  check:rules:
    cmds:
      - go tool promtool check rules --lint-fatal rendered/*-rules.yaml
      - go tool promtool test rules tests/prometheus/*.yaml
  check:alert-parity:
    cmds:
      - go run ./cmd/alertparity rendered
  check:alertmanager:
    cmds:
      - go tool amtool check-config rendered/alertmanager.yaml
      - go tool amtool config routes test --config.file=rendered/alertmanager.yaml --verify.receivers=discard severity=warning job=coredns
  check:dashboard:
    cmds:
      - bash tests/check-dashboard.sh
  check:go:
    cmds:
      - go tool golangci-lint run ./...
  check:shell:
    cmds:
      - go tool shfmt -d scripts tests
  check:jsonnet:
    cmds:
      - go tool jsonnetfmt --test mixins/*.jsonnet mixins/*.libsonnet
  check:workflow-input-defaults:
    cmds:
      - go run ./cmd/workflowcheck .github/workflows
      - go test ./cmd/workflowcheck
